<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Interface | CodSoft Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Monospaced:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <style>
        .atm-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0;
            overflow: hidden;
        }
        
        /* ATM Display Screen */
        .atm-screen {
            background: #0f172a;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--surface-border);
        }
        
        .bank-logo {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        
        .balance-display {
            font-family: 'Monospaced', monospace;
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin: 1rem 0;
        }
        
        .status-message {
            font-size: 0.9rem;
            color: var(--success-color);
            min-height: 20px;
        }
        
        /* ATM Controls Area */
        .atm-controls {
            padding: 2rem;
        }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .amount-input {
            text-align: center;
            font-family: 'Monospaced', monospace;
            font-size: 1.5rem;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--surface-border);
        }
        
        /* Panels */
        #loginPanel, #mainPanel, #historyPanel {
            display: none;
        }
        
        #loginPanel.active, #mainPanel.active, #historyPanel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        /* History Panel */
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
            text-align: left;
        }
        
        .history-item {
            padding: 1rem;
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
        }
        
        .history-item.deposit .amt { color: var(--success-color); }
        .history-item.withdraw .amt { color: var(--warning-color); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Dashboard
        </a>
    </header>

    <main class="container">
        <div class="glass-panel atm-container">
            
            <!-- LOGIN PANEL -->
            <div id="loginPanel" class="active">
                <div class="atm-screen" style="padding-bottom: 3rem;">
                    <div class="bank-logo">Secure Banking System</div>
                    <h2 style="margin-top: 2rem;">Welcome</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">Please insert your credentials</p>
                </div>
                <div class="atm-controls">
                    <div class="form-group">
                        <label>Account Number</label>
                        <input type="text" id="loginAccNo" placeholder="Try: 12345" value="12345">
                    </div>
                    <div class="form-group">
                        <label>PIN</label>
                        <input type="password" id="loginPin" placeholder="Try: 1234" value="1234">
                    </div>
                    <div id="loginError" style="color: var(--danger-color); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>
                    <button id="btnLogin" class="btn btn-primary" style="width: 100%;">Secure Login</button>
                </div>
            </div>
            
            <!-- MAIN ATM PANEL -->
            <div id="mainPanel">
                <div class="atm-screen">
                    <div class="bank-logo">Secure Banking System</div>
                    <div class="balance-display" id="displayBalance">₹ 0.00</div>
                    <div class="status-message" id="statusMessage">Welcome back, User</div>
                </div>
                <div class="atm-controls">
                    <div class="form-group">
                        <label style="text-align: center;">Enter Amount (₹)</label>
                        <input type="number" id="txtAmount" class="amount-input" placeholder="0.00">
                    </div>
                    
                    <div class="action-grid">
                        <button id="btnDeposit" class="btn" style="background: var(--success-color); color: white;">Deposit</button>
                        <button id="btnWithdraw" class="btn" style="background: var(--warning-color); color: white;">Withdraw</button>
                        <button id="btnHistory" class="btn btn-outline" style="grid-column: span 2;">View Transactions</button>
                        <button id="btnLogout" class="btn btn-outline" style="grid-column: span 2; border-color: rgba(239,68,68,0.3); color: var(--danger-color);">Logout</button>
                    </div>
                </div>
            </div>
            
            <!-- HISTORY PANEL -->
            <div id="historyPanel">
                <div class="atm-screen">
                    <div class="bank-logo">Mini Statement</div>
                    <h3 style="margin-top: 1rem;">Recent Transactions</h3>
                </div>
                <div class="atm-controls">
                    <div class="history-list" id="historyList">
                        <!-- History injected via JS -->
                    </div>
                    <button id="btnBackToMain" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">Back to Main</button>
                </div>
            </div>

        </div>
    </main>

    <script src="theme.js"></script>
    <script src="atm.js"></script>
</body>
</html>
