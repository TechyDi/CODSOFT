<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | CodSoft Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <style>
        .layout-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }
        
        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .form-panel {
            padding: 2rem;
        }
        
        .table-panel {
            padding: 1.5rem;
            overflow-x: auto;
        }
        
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
        
        .selected-row td {
            background: rgba(99, 102, 241, 0.2) !important;
        }
        
        .sort-icon {
            display: inline-block;
            margin-left: 0.5rem;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
        }
        
        .sort-asc .sort-icon { border-bottom: 4px solid var(--text-primary); }
        .sort-desc .sort-icon { border-top: 4px solid var(--text-primary); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Dashboard
        </a>
    </header>

    <main class="container">
        <div style="margin-bottom: 2rem;">
            <h2>Student Management</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Organize and manage student records efficiently.</p>
        </div>
        
        <div class="layout-grid">
            <!-- LEFT: FORM -->
            <div class="glass-panel form-panel animate-fade-in">
                <h3 style="margin-bottom: 1.5rem;">Student Details</h3>
                
                <div class="form-group">
                    <label>Roll Number (ID)*</label>
                    <input type="number" id="txtRoll" placeholder="e.g. 101">
                </div>
                
                <div class="form-group">
                    <label>Full Name*</label>
                    <input type="text" id="txtName" placeholder="Enter student name">
                </div>
                
                <div class="form-group">
                    <label>Grade (A-F)*</label>
                    <input type="text" id="txtGrade" placeholder="e.g. A" maxlength="1">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="txtEmail" placeholder="student@example.com">
                </div>
                
                <div id="formError" style="color: var(--danger-color); font-size: 0.85rem; margin-bottom: 1rem;"></div>
                
                <div class="btn-group">
                    <button id="btnAdd" class="btn" style="background: var(--success-color); color: white;">Add Student</button>
                    <button id="btnUpdate" class="btn btn-primary">Update</button>
                    <button id="btnDelete" class="btn btn-danger">Delete</button>
                    <button id="btnClear" class="btn btn-outline">Clear Form</button>
                </div>
            </div>
            
            <!-- RIGHT: TABLE -->
            <div class="glass-panel table-panel animate-fade-in" style="animation-delay: 0.1s;">
                <div class="search-bar">
                    <input type="text" id="txtSearch" placeholder="Search by Name or Roll No...">
                    <button id="btnExport" class="btn btn-outline" style="white-space: nowrap;">Export CSV</button>
                </div>
                
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th data-sort="roll">Roll No <span class="sort-icon"></span></th>
                            <th data-sort="name">Name <span class="sort-icon"></span></th>
                            <th data-sort="grade">Grade <span class="sort-icon"></span></th>
                            <th data-sort="email">Email <span class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state">
                    No students found. Add a student to get started.
                </div>
            </div>
        </div>
    </main>

    <script src="theme.js"></script>
    <script src="student.js"></script>
</body>
</html>
